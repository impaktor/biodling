baseURL = "https://impaktor.github.io/biodling/"   # change this! (or /repo-name/ for project pages)
locale = "en-us"
title = "Professorsstadens Bigård"
theme = "PaperMod"

[markup.goldmark.renderer]
  unsafe = true   # required for ox-hugo

[params]
  env = "production"
  description = "Hemsida för Fogelmarks biodling"
  author = "Karl Fogelmark"
  defaultTheme = "auto"          # light / dark / auto
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  # relativeURLs = true

[menu]
  [[menu.main]]
    name = "Home"         # Text that appears in the menu      
    url = "/"             # Path to the page or section        
    weight = 10           # Lower number = appears further left

  [[menu.main]]
    name = "Posts"
    url = "/posts/"
    weight = 20

  [[menu.main]]
    name = "Köp"  
    url = "/köp/" 
    weight = 30   

  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 40

