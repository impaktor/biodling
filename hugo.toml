# baseURL = "https://impaktor.github.io/biodling/"
baseURL = "https://bin.fogelmark.org/"
defaultContentLanguage = "sv"
locale = "sv-se"
title = "Professorsstadens Bigård"
theme = "PaperMod"
canonifyURLs = true
relativeURLs = false

[outputs]
  home = ["HTML", "RSS", "JSON"]   # JSON is optional (needed for search)

[markup.goldmark.renderer]
  unsafe = true   # required for ox-hugo

[params.profileMode]
  enabled = false   # lest _index.md will be ignored

[params]
  env = "production"
  description = "Hemsida för Fogelmarks biodling"
  author = "Karl Fogelmark"
  defaultTheme = "auto"          # light / dark / auto
  disableSpecial1stPost = true   # don't make first post look different
  ShowReadingTime = false
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowFullTextinRSS = true               # include full post content in the feed (nice for readers)
  ShowRssButtonInSectionTermList = true  # show RSS icon on list/tag/category pages
  # 
  # [[params.socialIcons]]
  #   name = "rss"
  #   url  = "index.xml"

[params.umami]
  script = "https://analytics.pioneerspacesim.net/script.js"
  id     = "edf62d47-23a4-4382-9b25-fa816bdf9131"
  host   = "https://analytics.pioneerspacesim.net"

[menu]
  [[menu.main]]
    name = "Hem"          # Text that appears in the menu      
    url = ""              # Path to the page or section        
    weight = 10           # Lower number = appears further left

  [[menu.main]]
    name = "Inlägg"
    url = "posts/"
    weight = 20

  [[menu.main]]
    name = "Köp"
    url = "köp/" 
    weight = 30   

  [[menu.main]]
    name = "Vanliga frågor"
    url = "faq/" 
    weight = 40   

  [[menu.main]]
    name = "Om oss"
    url = "about/"
    weight = 50

